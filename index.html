<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b3d2e">
<title>Quad Squad — Steaks Day 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
  :root{
    --green:#0b3d2e; --green2:#0f5138; --gold:#e4b84a; --gold2:#f2d488;
    --ink:#0a0f0d; --paper:#f6f4ec; --mut:#9fb3aa; --line:rgba(255,255,255,.12);
    --rose:#c9385b; --blue:#2f6fb0; --win:#43b36b; --lose:#c0506a;
    --bg:#07231a; --card:#0e3326; --card2:#124031;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--paper); -webkit-font-smoothing:antialiased;
    padding-bottom:calc(84px + env(safe-area-inset-bottom)); min-height:100vh;
  }
  a{color:var(--gold)}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  h1,h2,h3{margin:.2em 0}
  #app{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .hero{position:relative;height:190px;overflow:hidden;border-bottom:2px solid var(--gold)}
  .hero img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05)}
  .hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,35,26,.1),rgba(7,35,26,.92))}
  .hero .ttl{position:absolute;left:0;right:0;bottom:10px;text-align:center}
  .hero .ttl .k{font-size:12px;letter-spacing:3px;color:var(--gold2);text-transform:uppercase}
  .hero .ttl .b{font-size:26px;font-weight:800;text-shadow:0 2px 8px #000}
  .hero .ttl .b em{color:var(--gold);font-style:normal}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
  .row{display:flex;align-items:center;gap:10px}
  .spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mut{color:var(--mut)}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.g{background:rgba(228,184,74,.16);color:var(--gold2)}
  .pill.blue{background:rgba(47,111,176,.2);color:#bcd7f2}
  .pill.rose{background:rgba(201,56,91,.2);color:#f3b9c8}
  .pill.live{background:#b1232f;color:#fff}
  .pill.lock{background:#333d39;color:#cfe}
  .pill.done{background:rgba(67,179,107,.2);color:#bdf0cf}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;
    padding:12px 16px;font-size:15px;font-weight:700;background:var(--gold);color:#201700;cursor:pointer}
  .btn.sec{background:var(--card2);color:var(--paper);border:1px solid var(--line)}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
  .btn:disabled{opacity:.45}
  .grid{display:grid;gap:8px}
  input,select,textarea{background:#09271d;border:1px solid var(--line);color:var(--paper);border-radius:10px;padding:10px;font-size:16px;width:100%}
  label{font-size:12px;color:var(--mut)}
  .tabs{display:flex;gap:6px;margin:10px 0}
  .tab{flex:1;text-align:center;padding:9px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mut)}
  .tab.on{background:var(--gold);color:#201700;border-color:var(--gold)}
  .nav{position:fixed;left:0;right:0;bottom:0;background:#061c15;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .nav .inner{max-width:560px;margin:0 auto;display:flex}
  .nav a{flex:1;text-align:center;padding:10px 2px 8px;color:var(--mut);font-size:10.5px;text-decoration:none;font-weight:600}
  .nav a.on{color:var(--gold)}
  .nav .ic{display:block;font-size:19px;line-height:1}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold2);overflow:hidden;flex:0 0 auto;border:1px solid var(--line)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .lb{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
  .lb .rk{width:22px;text-align:center;font-weight:800;color:var(--mut)}
  .lb .pts{font-weight:800}
  .pos{color:var(--win)} .neg{color:var(--lose)}
  .vs{display:flex;height:16px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .vs .b{height:100%} .vs .m{background:var(--blue)} .vs .g{background:var(--rose)}
  .race{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .race .tno{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
  .race .flem{background:rgba(47,111,176,.22);color:#bcd7f2}
  .race .rose{background:rgba(228,184,74,.18);color:var(--gold2)}
  .overlay{position:fixed;inset:0;background:rgba(3,14,10,.97);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--gold);border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;max-height:86vh;overflow:auto}
  .sheet .wrap{padding:0}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%}
  .namebtn{width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--paper);font-size:16px;font-weight:700;margin:6px 0;display:flex;align-items:center;gap:10px}
  .namebtn .s{font-size:12px;color:var(--mut);font-weight:500}
  .small{font-size:12px}
  .hint{font-size:12px;color:var(--mut);margin:4px 0}
  .warn{background:rgba(201,56,91,.14);border:1px solid rgba(201,56,91,.4);color:#f3b9c8;border-radius:10px;padding:8px 10px;font-size:12px}
  .ok{background:rgba(67,179,107,.14);border:1px solid rgba(67,179,107,.4);color:#bdf0cf;border-radius:10px;padding:8px 10px;font-size:12px}
  .count{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold2)}
  hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .tagline{font-size:11px;color:var(--mut);text-align:center;margin:6px 0 2px}
  .wheelwrap{position:fixed;inset:0;background:rgba(3,14,10,.98);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom));text-align:center}
  .wheelstage{position:relative;width:280px;height:280px;margin:14px 0}
  .wheel{position:absolute;inset:0;border-radius:50%;border:6px solid var(--gold);transition:transform 5.2s cubic-bezier(.1,.6,.1,1);box-shadow:0 0 0 4px #0b3d2e,0 12px 44px #000}
  .wheel .lab{position:absolute;left:50%;top:50%;transform-origin:center;font-size:12px;font-weight:800;color:#eaf5ee;white-space:nowrap}
  .wpointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:26px solid var(--gold);filter:drop-shadow(0 2px 3px #000)}
  .whub{position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);background:var(--green);border:3px solid var(--gold);border-radius:50%;z-index:2;display:flex;align-items:center;justify-content:center;font-size:22px}
  .wtitle{font-size:17px;font-weight:800;color:var(--gold2);margin-bottom:2px}
  .bigreveal{font-size:19px;line-height:1.55;font-weight:700}
</style>
</head>
<body>
<button id="refresh" class="btn sm" style="display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:40" onclick="render()">🔄 New updates — tap to refresh</button>
<div id="app"><div class="center" style="min-height:70vh"><div class="mut">Loading Steaks Day…</div></div></div>
<nav class="nav" id="nav" style="display:none">
  <div class="inner">
    <a data-view="home"><span class="ic">🏆</span>Board</a>
    <a data-view="races"><span class="ic">🐎</span>Races</a>
    <a data-view="bets"><span class="ic">🎰</span>My Bets</a>
    <a data-view="games"><span class="ic">🎲</span>Games</a>
    <a data-view="admin" id="navAdmin" style="display:none"><span class="ic">🛠️</span>Admin</a>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://odpexghueerscbvdkjjy.supabase.co";
const SUPABASE_KEY = "sb_publishable_Fo8aqLCTsxlDLmmTSfy0iA_v5EaHVk2";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const S = { me:null, view:'home', loaded:false, data:{}, openFields:new Set() };
const $ = (s,el=document)=>el.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;};
const money = n => (n<0?'-$':'$')+Math.abs(Math.round(n));
const esc = s => (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- data ----------
async function loadAll(){
  const tables = ['couples','players','races','runners','bets','pod_assignments','quaddies','quaddie_groups','quaddie_entries','feature_votes','feature_picks','group_bets','settings'];
  const out = {};
  await Promise.all(tables.map(async t=>{
    const {data,error} = await sb.from(t).select('*');
    out[t] = error ? [] : data;
  }));
  S.data = out;
  S.loaded = true;
}
function raceById(id){ return (S.data.races||[]).find(r=>r.id===id); }
function myPlayer(){ return (S.data.players||[]).find(p=>p.id===S.me); }
function isLocked(r){ if(!r) return true; if(r.status!=='upcoming') return true; return r.jump_time && new Date(r.jump_time) <= new Date(); }
function melbTime(iso){ try{return new Date(iso).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',timeZone:'Australia/Melbourne'});}catch(e){return '';} }

// ---------- scoring ----------
function playerPoints(pid){
  return (S.data.bets||[]).filter(b=>b.player_id===pid).reduce((a,b)=>a+Number(b.points||0),0);
}
function genderPoints(g){
  const ids = (S.data.players||[]).filter(p=>p.gender===g).map(p=>p.id);
  const bp = (S.data.bets||[]).filter(b=>ids.includes(b.player_id)).reduce((a,b)=>a+Number(b.points||0),0);
  const gb = (S.data.group_bets||[]).filter(x=>x.gender_scope===g).reduce((a,b)=>a+Number(b.points||0),0);
  const qe = (S.data.quaddie_entries||[]).filter(e=>ids.includes(e.player_id)).reduce((a,e)=>a+quaddieEntryPoints(e),0);
  const qn = (S.data.quaddies||[]).reduce((a,q)=>a+(q.gender_scope===g?1:q.gender_scope==='ALL'?0.5:0)*quaddieNet(q),0);
  return bp+gb+qe+qn;
}
// shortcut: brief says "points per correct leg" with no value, so 10 pts (one $10 unit) per correct pick
const QUADDIE_LEG_PTS = 10;
function quaddieLegRace(q,legIndex){ return raceById((q.leg_race_ids||[])[legIndex-1]); }
function quaddieEntryPoints(e){
  const q=(S.data.quaddies||[]).find(q=>q.id===e.quaddie_id); if(!q) return 0;
  const r=quaddieLegRace(q,e.leg_index);
  return r && r.status==='resulted' && r.result_win===e.runner_number ? QUADDIE_LEG_PTS : 0;
}
function quaddieReturns(){ const s=(S.data.settings||[]).find(s=>s.key==='quaddie_returns'); return (s&&s.value)||{}; }
// Net $ once all 4 legs are run: Sportsbet return (entered by admin) minus stake. Mixed quaddie splits 50/50.
function quaddieNet(q){
  const legs=(q.leg_race_ids||[]).map(raceById);
  if(legs.length!==4 || legs.some(r=>!r||r.status!=='resulted')) return 0;
  return Number(quaddieReturns()[q.id]||0) - Number(q.stake||0);
}
// Landed = every leg's winner was covered by someone's entry for that leg.
function quaddieLanded(q){
  const legs=(q.leg_race_ids||[]).map(raceById);
  if(legs.some(r=>!r||r.status!=='resulted')) return null;
  return legs.every((r,i)=>(S.data.quaddie_entries||[]).some(e=>e.quaddie_id===q.id&&e.leg_index===i+1&&e.runner_number===r.result_win));
}
function anyResulted(){ return (S.data.races||[]).some(r=>r.status==='resulted'); }
function couplePoints(cid){
  const ids = (S.data.players||[]).filter(p=>p.couple_id===cid).map(p=>p.id);
  return (S.data.bets||[]).filter(b=>ids.includes(b.player_id)).reduce((a,b)=>a+Number(b.points||0),0);
}
function groupPnl(){
  const st = (S.data.settings||[]).find(s=>s.key==='pnl'); const v = st? st.value : {staked:2000,returned:0};
  return {staked:Number(v.staked||2000), returned:Number(v.returned||0)};
}

// ---------- render shell ----------
function render(){
  if(!S.loaded){ return; }
  if(!S.me){ renderLogin(); return; }
  $('#nav').style.display='block';
  const me = myPlayer();
  $('#navAdmin').style.display = (me && me.is_admin)?'':'none';
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.view===S.view));
  const app = $('#app');
  const views = {home:renderHome, races:renderRaces, bets:renderBets, games:renderGames, admin:renderAdmin};
  const y = window.scrollY;
  app.innerHTML = '';
  app.appendChild((views[S.view]||renderHome)());
  window.scrollTo(0,y);
  S.dirty=false; S.pending=false; $('#refresh').style.display='none';
}
// Live updates must not wipe what someone is half-way through typing.
function isEditing(){
  const a=document.activeElement;
  return S.dirty || !!document.querySelector('.sheet') || (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}
function liveRender(){
  if(isEditing()){ S.pending=true; $('#refresh').style.display='block'; return; }
  render();
}
document.addEventListener('input',e=>{ if(e.target.closest('#app')) S.dirty=true; });
document.addEventListener('focusout',()=>setTimeout(()=>{ if(S.pending && !isEditing()) render(); },300));

// ---------- login ----------
function renderLogin(){
  $('#nav').style.display='none';
  const app=$('#app');
  const players=(S.data.players||[]).slice().sort((a,b)=>a.sort_order-b.sort_order);
  const v=el(`<div>
    <div class="hero"><img src="assets/hero-gates.webp" alt=""><div class="ov"></div>
      <div class="ttl"><div class="k">The Quad Squad</div><div class="b">STEAKS DAY <em>2026</em></div></div></div>
    <div class="wrap">
      <p class="tagline">Flemington × Rosehill · Sat 7 Nov · from 2:30pm</p>
      <div class="card"><div style="font-weight:800;margin-bottom:6px">Who are you?</div>
      <div class="hint">Tap your name to jump in — no password.</div>
      <div id="names"></div></div>
    </div></div>`);
  const box=v.querySelector('#names');
  players.forEach(p=>{
    const c=(S.data.couples||[]).find(c=>c.id===p.couple_id);
    const b=el(`<button class="namebtn"><span class="avatar">${initials(p)}</span>
      <span>${esc(p.display_name)}${p.is_prez?' 👑':''}<span class="s"> · ${esc(c?c.label:'')}</span></span></button>`);
    b.onclick=()=>confirmLogin(p);
    box.appendChild(b);
  });
  app.innerHTML=''; app.appendChild(v);
}
function initials(p){ if(p.photo_url) return `<img src="${esc(p.photo_url)}">`; return esc((p.display_name||'?').slice(0,1).toUpperCase()); }
function confirmLogin(p){
  const sheet=el(`<div class="sheet"><div class="center" style="min-height:auto">
    <div class="avatar" style="width:72px;height:72px;font-size:28px">${initials(p)}</div>
    <h2 style="margin:12px 0 0">Are you ${esc(p.display_name)}?</h2>
    <p class="mut small">${p.is_prez?'President of the Quad Squad 👑':''}</p>
    <div class="row" style="margin-top:14px;width:100%">
      <button class="btn sec" style="flex:1" id="no">No</button>
      <button class="btn" style="flex:2" id="yes">Yes, that's me</button></div>
  </div></div>`);
  document.body.appendChild(sheet);
  sheet.querySelector('#no').onclick=()=>sheet.remove();
  sheet.querySelector('#yes').onclick=()=>{ localStorage.setItem('qs_me',p.id); S.me=p.id; sheet.remove(); S.view='home'; render(); };
}

// ---------- home / leaderboard ----------
let lbTab='ind';
function renderHome(){
  const pnl=groupPnl(); const net=pnl.returned-pnl.staked;
  const mp=genderPoints('M'), fp=genderPoints('F');
  const tot=Math.max(1,Math.abs(mp)+Math.abs(fp));
  const mPct=Math.max(8,Math.min(92, 50 + (mp-fp)/tot*42 ));
  const v=el(`<div>
    <div class="hero"><img src="assets/hero-finish.webp" alt=""><div class="ov"></div>
      <div class="ttl"><div class="k">The Quad Squad</div><div class="b">STEAKS DAY <em>2026</em></div></div></div>
    <div class="wrap">
      <div class="card">
        <div class="spread"><div><div class="mut small">GROUP P&L · real $ on Sportsbet</div>
          <div style="font-size:26px;font-weight:800" class="${net>=0?'pos':'neg'}">${net>=0?'+':''}${money(net)}</div></div>
          <div style="text-align:right"><div class="mut small">Staked</div><div style="font-weight:700">${money(pnl.staked)}</div>
          <div class="mut small" style="margin-top:4px">Returned</div><div style="font-weight:700">${money(pnl.returned)}</div></div>
        </div>
      </div>
      <div class="card">
        <div class="spread" style="margin-bottom:8px">
          <div><span class="pill blue">👔 GUYS</span> <b class="${mp>=0?'pos':'neg'}">${mp>=0?'+':''}${Math.round(mp)}</b></div>
          <div class="mut small">Battle of the Sexes</div>
          <div><b class="${fp>=0?'pos':'neg'}">${fp>=0?'+':''}${Math.round(fp)}</b> <span class="pill rose">GIRLS 👗</span></div>
        </div>
        <div class="vs"><div class="b m" style="width:${mPct}%"></div><div class="b g" style="width:${100-mPct}%"></div></div>
      </div>
      <div class="tabs">
        <div class="tab ${lbTab==='ind'?'on':''}" data-t="ind">Players</div>
        <div class="tab ${lbTab==='cup'?'on':''}" data-t="cup">Couples</div>
        <div class="tab ${lbTab==='gen'?'on':''}" data-t="gen">Guys v Girls</div>
      </div>
      <div class="card" id="board"></div>
    </div></div>`);
  v.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{lbTab=t.dataset.t;render();});
  renderBoard(v.querySelector('#board'));
  return v;
}
function renderBoard(box){
  if(lbTab==='ind'){
    const rows=(S.data.players||[]).map(p=>({p,pts:playerPoints(p.id)})).sort((a,b)=>b.pts-a.pts);
    const lowest=rows.length&&anyResulted()?rows[rows.length-1].p.id:null;
    box.innerHTML='';
    rows.forEach((r,i)=>{
      box.appendChild(el(`<div class="lb"><div class="rk">${i+1}</div>
        <div class="avatar">${initials(r.p)}</div>
        <div style="flex:1"><div>${esc(r.p.display_name)}${r.p.is_prez?' 👑':''}${r.p.id===lowest?' <span class="pill lock">🥄 Mug</span>':''}</div>
        <div class="mut small">${r.p.gender==='M'?'👔':'👗'} ${esc(coupleLabel(r.p.couple_id))}</div></div>
        <div class="pts ${r.pts>=0?'pos':'neg'}">${r.pts>=0?'+':''}${Math.round(r.pts)}</div></div>`));
    });
  } else if(lbTab==='cup'){
    const rows=(S.data.couples||[]).map(c=>({c,pts:couplePoints(c.id)})).sort((a,b)=>b.pts-a.pts);
    box.innerHTML='';
    rows.forEach((r,i)=>box.appendChild(el(`<div class="lb"><div class="rk">${i+1}</div>
      <div style="flex:1"><b>${esc(r.c.label)}</b></div>
      <div class="pts ${r.pts>=0?'pos':'neg'}">${r.pts>=0?'+':''}${Math.round(r.pts)}</div></div>`)));
  } else {
    const mp=genderPoints('M'), fp=genderPoints('F');
    box.innerHTML='';
    [['👔 Guys',mp,'blue'],['👗 Girls',fp,'rose']].sort((a,b)=>b[1]-a[1]).forEach((r,i)=>
      box.appendChild(el(`<div class="lb"><div class="rk">${i+1}</div>
        <div style="flex:1;font-size:18px;font-weight:800">${r[0]}</div>
        <div class="pts ${r[1]>=0?'pos':'neg'}">${r[1]>=0?'+':''}${Math.round(r[1])}</div></div>`)));
    box.appendChild(el(`<div class="hint" style="margin-top:8px">Includes quaddies, feature (×3), mysteries & get-out-of-jail.</div>`));
  }
}
function coupleLabel(cid){const c=(S.data.couples||[]).find(c=>c.id===cid);return c?c.label:'';}

// ---------- races ----------
function renderRaces(){
  const races=(S.data.races||[]).slice().sort((a,b)=>a.sort_order-b.sort_order);
  const v=el(`<div class="wrap"><h2 style="margin-top:14px">🐎 Race Timeline</h2>
    <p class="hint">12 races from 2:30pm (Melbourne). Bets lock at the jump.</p><div class="card" id="rl"></div></div>`);
  const box=v.querySelector('#rl');
  races.forEach(r=>{

             : locked?`<span class="pill lock">LOCKED</span>`
             : `<span class="count" data-jt="${r.jump_time}">—</span>`;
    box.appendChild(el(`<div class="race"><div class="tno ${r.track==='Flemington'?'flem':'rose'}">R${r.race_no}</div>

      <div style="text-align:right">${st}</div></div>`));
  });

}
function tickCountdowns(){
  document.querySelectorAll('.count[data-jt]').forEach(c=>{
    const t=new Date(c.dataset.jt)-new Date();
    if(t<=0){c.textContent='JUMP';return;}
    const m=Math.floor(t/60000), s=Math.floor(t%60000/1000);
    const h=Math.floor(m/60);
    c.textContent = h>0?`${h}h ${m%60}m`:`${m}:${String(s).padStart(2,'0')}`;
  });
}
setInterval(tickCountdowns,1000);

function myPodRace(){ const a=(S.data.pod_assignments||[]).find(x=>x.player_id===S.me); return a?raceById(a.race_id):null; }
function myQuaddieLegRaces(){
  const out=new Set();
  (S.data.quaddie_groups||[]).filter(g=>g.player_id===S.me).forEach(g=>{
    const q=(S.data.quaddies||[]).find(q=>q.id===g.quaddie_id); if(!q) return;

    if(q.style==='split'){ (g.grp==='first'?[legs[0],legs[1]]:[legs[2],legs[3]]).forEach(id=>out.add(id)); }

function betEditor(race,type,stake,blocked){
  const mine=myBet(race.id,type);
  const locked=isLocked(race);
  const runners=(S.data.runners||[]).filter(x=>x.race_id===race.id && !x.scratched).sort((a,b)=>a.number-b.number);
  const box=el(`<div class="card"><div class="spread">

      <div>${locked?'<span class="pill lock">LOCKED</span>':''}</div></div>`);
  if(blocked){ box.appendChild(el(`<div class="hint">You're repping the group here — no double-dipping.</div>`)); return box; }
  if(mine && !locked && isScratched(race.id,mine.runner_number)) box.appendChild(el(`<div class="warn" style="margin-top:6px">⚠️ #${mine.runner_number} ${esc(mine.horse_name||'')} was scratched — pick again (it refunds if you leave it).</div>`));

    ? `<select class="rn"><option value="">Pick a runner…</option>${runners.map(r=>`<option value="${r.number}" ${mine&&mine.runner_number===r.number?'selected':''}>#${r.number} ${esc(r.horse_name)}</option>`).join('')}</select>`
    : `<input class="rn2" type="number" inputmode="numeric" placeholder="Runner # (fields TBD)" value="${mine?mine.runner_number||'':''}">`;
  const ed=el(`<div class="grid" style="grid-template-columns:1fr 90px auto;align-items:end;margin-top:8px">

    if(!rn){ alert('Pick a runner'); return; }
    if(!(Number(od)>1)){ alert('Enter the Sportsbet odds you took (e.g. 4.50)'); return; }

    const runnerObj=runners.find(r=>r.number==rn);

      horse_name:runnerObj?runnerObj.horse_name:null, stake:stake, odds:Number(od), status:'open' };
    const {error}=await sb.from('bets').upsert(rec,{onConflict:'player_id,race_id,bet_type'});

function quaddieLeg(q,race,legIndex){
  if(!race) return el('<div></div>');
  const mine=(S.data.quaddie_entries||[]).find(e=>e.quaddie_id===q.id&&e.player_id===S.me&&e.leg_index===legIndex);
  const runners=(S.data.runners||[]).filter(x=>x.race_id===race.id&&!x.scratched).sort((a,b)=>a.number-b.number);
  const locked=isLocked(race);
  const rOpts = runners.length
    ? `<select class="rn"><option value="">#…</option>${runners.map(r=>`<option value="${r.number}" ${mine&&mine.runner_number===r.number?'selected':''}>#${r.number} ${esc(r.horse_name)}</option>`).join('')}</select>`

    <div>${rOpts}</div>
    <button class="btn sm save" ${locked?'disabled':''}>${mine?'✓':'Save'}</button></div>`);

    if(await jumped(race)) return;
    const rn=(row.querySelector('.rn')||row.querySelector('.rn2')).value; if(!rn){alert('Pick a number');return;}
    const {error}=await sb.from('quaddie_entries').upsert({quaddie_id:q.id,player_id:S.me,leg_index:legIndex,runner_number:Number(rn)},{onConflict:'quaddie_id,player_id,leg_index'});

  const scr=card.querySelector('.scr');
  runners.forEach(x=>{
    const b=el(`<button class="btn sm ${x.scratched?'':'sec'}" title="Tap to ${x.scratched?'un-scratch':'scratch'}">${x.scratched?'❌ ':''}#${x.number} ${esc(x.horse_name)}</button>`);
    b.onclick=async()=>{
      const picks=picksOn(r.id,x.number);
      if(!confirm(`${x.scratched?'Un-scratch':'Scratch'} #${x.number} ${x.horse_name}?${!x.scratched&&picks.length?`\n\n${picks.length} pick${picks.length>1?'s are':' is'} on it: ${picks.join(', ')}.\nThey'll see a "pick again" warning; bets left on it refund at settle.`:''}`)) return;
      const {error}=await sb.from('runners').update({scratched:!x.scratched}).eq('id',x.id);
      if(error){alert(error.message);return;} await loadAll(); render();
    };
    scr.appendChild(b);
  });
  const fld=card.querySelector('.fld'), pv=card.querySelector('.pv');
  fld.oninput=()=>{ const p=parseField(fld.value);
    pv.innerHTML = p.length ? `Reads as ${p.length}: ${p.map(x=>`<b>${x.number}</b> ${esc(x.horse_name)}${x.scratched?' ❌':''}`).join(' · ')}`
      : (fld.value.trim()?'<span class="neg">Nothing readable — start each line with the runner number.</span>':''); };
  card.querySelector('.loadf').onclick=async()=>{
    const parsed=parseField(fld.value);
    if(!parsed.length){ alert('No runners found. Use one per line: 1 Horse Name'); return; }
    // names only, so re-pasting a field never un-scratches anyone; SCR lines are scratched after
    const {error}=await sb.from('runners').upsert(parsed.map(x=>({race_id:r.id,number:x.number,horse_name:x.horse_name})),{onConflict:'race_id,number'});
    if(error){alert(error.message);return;}
    const scr=parsed.filter(x=>x.scratched).map(x=>x.number);
    if(scr.length){ const {error:e2}=await sb.from('runners').update({scratched:true}).eq('race_id',r.id).in('number',scr); if(e2) alert('Field loaded, but scratching failed: '+e2.message); }
    S.dirty=false; await loadAll(); render();
  };
  return card;
}
// Pasted field → [{number, horse_name, scratched}]. Accepts "1 Horse", "1. Horse", "1) Horse", "1 - Horse",
// "1Horse(4)". Strips barriers "(4)" and weights "58.5kg"; skips jockey/trainer lines from a copied form guide;
// "SCR"/"scratched" on a line marks it scratched. No numbers at all → numbered 1,2,3… in order.
// Duplicate numbers keep the last line (a duplicate in one upsert makes Postgres reject the whole load).
function parseField(text){
  const lines=(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const re=/^(\d{1,2})(?:\s*[.):\-–]\s*|\s+|(?=[A-Za-z]))(.+)$/;
  const anyNum=lines.some(l=>re.test(l));
  const out=new Map(); let auto=0;
  for(const l of lines){
    let num,name; const m=l.match(re);
    if(m){ num=Number(m[1]); name=m[2]; }
    else if(!anyNum){ num=++auto; name=l; }
    else continue;
    if(/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{2,4}\b/i.test(name)) continue; // "10 Nov 2026"
    const scratched=/\b(scr|scratched)\b/i.test(name);
    name=name.replace(/\b(scr|scratched)\b\.?/ig,' ')
             .split(/\s*\(|\t|\s{2,}|\s+\d{2}(?:\.\d)?\s*kg\b/i)[0]
             .replace(/[\s.\-–|]+$/,'').trim();
    if(num>=1 && num<=30 && name) out.set(num,{number:num,horse_name:name,scratched});
  }
  return [...out.values()].sort((a,b)=>a.number-b.number);
}
function isScratched(raceId,num){ return (S.data.runners||[]).some(x=>x.race_id===raceId&&x.number===num&&x.scratched); }
// Who has a pick on this runner — shown before scratching so admins know who to tell.
function picksOn(raceId,num){
  const pn=id=>{const p=(S.data.players||[]).find(p=>p.id===id);return p?p.display_name:'?';};
  const out=[];
  (S.data.bets||[]).filter(b=>b.race_id===raceId&&b.runner_number===num).forEach(b=>out.push(pn(b.player_id)+(b.bet_type==='pick_of_day'?' (POD)':'')));
  (S.data.quaddie_entries||[]).forEach(e=>{ const q=(S.data.quaddies||[]).find(q=>q.id===e.quaddie_id);
    if(q && (q.leg_race_ids||[])[e.leg_index-1]===raceId && e.runner_number===num) out.push(pn(e.player_id)+' (quaddie)'); });
  if(raceId===108){
    (S.data.feature_votes||[]).filter(v=>v.runner_number===num).forEach(v=>out.push(pn(v.player_id)+' (feature vote)'));
    (S.data.feature_picks||[]).filter(p=>p.locked&&p.runner_number===num).forEach(p=>out.push((p.gender==='M'?'Guys':'Girls')+' feature pick'));
  }
  (S.data.group_bets||[]).filter(g=>g.category!=='feature'&&g.race_id===raceId&&g.runner_number===num).forEach(g=>out.push(g.label));
  return out;
}
function groupBetEditor(g){
  const fp = g.category==='feature' ? (S.data.feature_picks||[]).find(p=>p.gender===g.gender_scope) : null;
  const rn = g.category==='feature' ? (fp&&fp.locked?fp.runner_number:'') : (g.runner_number||'');
  const row=el(`<div class="grid" style="grid-template-columns:1fr 70px 80px auto;align-items:end;margin-top:8px">
    <div class="small"><b>${esc(g.label)}</b>${g.status!=='open'?` <span class="pill done">${g.status.toUpperCase()}</span>`:''}</div>
    <div><label>Horse #</label><input class="rn" type="number" inputmode="numeric" value="${rn}" ${g.category==='feature'?'disabled placeholder="vote"':''}></div>
    <div><label>Odds</label><input class="od" type="number" step="0.01" inputmode="decimal" value="${g.odds||''}"></div>
    <button class="btn sm">Save</button></div>`);
  row.querySelector('button').onclick=async()=>{
    const od=Number(row.querySelector('.od').value); if(!(od>1)){ alert('Enter the odds (e.g. 4.50)'); return; }
    const upd={odds:od};
    if(g.category!=='feature'){ const n=Number(row.querySelector('.rn').value); if(!n){ alert('Enter the horse #'); return; } upd.runner_number=n; }
    const {error}=await sb.from('group_bets').update(upd).eq('id',g.id);
    if(error){alert(error.message);return;} await loadAll(); render();
  };
  return row;
}

// ---- admin actions ----
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
async function drawPod(){
  await loadAll(); // the admin phone may have slept and missed live updates
  // 8 nominated races, assign each of 8 boys to one race, each of 8 girls to one race (random)
  if((S.data.pod_assignments||[]).length && !confirm('Already drawn. Re-draw Pick of the Day? Everyone gets a new race, and any POD bets already placed stay on the old race.')) return;
  const noms=(S.data.races||[]).filter(r=>r.pod_nominated).sort((a,b)=>a.sort_order-b.sort_order);
  const boys=shuffle((S.data.players||[]).filter(p=>p.gender==='M'));
  const girls=shuffle((S.data.players||[]).filter(p=>p.gender==='F'));
  const rows=[];
  boys.forEach((p,i)=>rows.push({player_id:p.id,race_id:noms[i%noms.length].id}));
  girls.forEach((p,i)=>rows.push({player_id:p.id,race_id:noms[i%noms.length].id}));
  const {error}=await sb.from('pod_assignments').upsert(rows,{onConflict:'player_id'});
  msg(error?('Error: '+error.message):'Pick-of-the-Day races drawn ✓'); await loadAll(); render();
}
async function drawQuaddieSplits(){
  await loadAll(); // the admin phone may have slept and missed live updates
  if((S.data.quaddie_groups||[]).length && !confirm('Already drawn. Re-draw the Flem quaddie splits? Picks already entered stay on their old legs.')) return;
  const rows=[];
  for(const q of (S.data.quaddies||[]).filter(q=>q.style==='split')){
    const pool=shuffle((S.data.players||[]).filter(p=>p.gender===q.gender_scope));
    pool.forEach((p,i)=>rows.push({quaddie_id:q.id,player_id:p.id,grp:i<pool.length/2?'first':'last'}));
  }
  const {error}=await sb.from('quaddie_groups').upsert(rows,{onConflict:'quaddie_id,player_id'});
  msg(error?('Error: '+error.message):'Flem quaddie splits drawn ✓'); await loadAll(); render();
}
async function lockFeature(){
  await loadAll(); // the admin phone may have slept and missed live updates
  for(const g of ['M','F']){
    const votes=(S.data.feature_votes||[]).filter(v=>v.gender===g && !isScratched(108,v.runner_number)); // scratched horses can't run
    if(!votes.length) continue;
    const tally={}; votes.forEach(v=>tally[v.runner_number]=(tally[v.runner_number]||0)+1);
    const win=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0][0];
    await sb.from('feature_picks').upsert({gender:g,runner_number:Number(win),locked:true},{onConflict:'gender'});
  }
  msg('Feature picks locked ✓'); await loadAll(); render();
}
async function spinMystery(m){
  if(m.race_id && !confirm(`Re-spin ${m.label}? It's already on R${raceById(m.race_id)?.race_no} #${m.runner_number}.`)) return;
  // only races still open for betting that have a field loaded
  const live=r=>(S.data.runners||[]).filter(x=>x.race_id===r.id&&!x.scratched);
  const pool=(S.data.races||[]).filter(r=>r.track===m.track && !isLocked(r) && live(r).length);
  if(!pool.length){ alert(`No open ${m.track} race with a field loaded. Load runners first.`); return; }
  const race=pool[Math.floor(Math.random()*pool.length)];
  const runners=live(race);
  const rn = runners[Math.floor(Math.random()*runners.length)].number;
  const {error}=await sb.from('group_bets').update({race_id:race.id,runner_number:rn,odds:null}).eq('id',m.id);
  if(error){ alert(error.message); return; }
  msg(`🎡 ${m.label}: R${race.race_no} ${race.name} → #${rn}`); await loadAll(); render();
}
// ---------- the Mystery wheel, live on every phone ----------
// The admin's phone drives the spin and broadcasts each step (open → spin to angle T → reveal) over
// Supabase Realtime broadcast — no DB rows. Every other phone builds the same wheel and animates to the
// same angle, so the whole squad watches it land together. The result is still saved to group_bets,
// so anyone who missed it sees it in Games → Mysteries.
const WHEEL_EVENT='w';
let wheelCh=null;
function wheelBus(){ return window.__wheelBus || { send:p=>wheelCh&&wheelCh.send({type:'broadcast',event:WHEEL_EVENT,payload:p}).catch(()=>{}) }; }
function wheelSend(p){ try{ wheelBus().send(p); }catch(e){} }
function wheelOverlay(label,sub){
  document.querySelectorAll('.wheelwrap').forEach(x=>x.remove());
  const ov=el(`<div class="wheelwrap">
    <div style="font-size:13px;color:var(--mut)">🎡 ${esc(label)}</div>
    <div class="small wsub" style="color:var(--gold2);margin-top:4px">${esc(sub||'')}</div>
    <div class="wtitle"></div>
    <div class="wst"></div>
    <div class="wctrl" style="margin-top:14px"></div>
    <button class="btn sec sm wclose" style="margin-top:16px">Close</button></div>`);
  document.body.appendChild(ov);
  return {ov, sub:ov.querySelector('.wsub'), wt:ov.querySelector('.wtitle'), stage:ov.querySelector('.wst'), ctrl:ov.querySelector('.wctrl'), close:ov.querySelector('.wclose')};
}
function buildWheel(stage,labels){
  const N=labels.length, seg=360/N;
  const cols=['#0f5138','#124031','#1a5a3f','#0c3f2d'];
  const stops=labels.map((_,i)=>`${cols[i%cols.length]} ${i*seg}deg ${(i+1)*seg}deg`).join(',');
  stage.innerHTML='';
  const wrap=el(`<div class="wheelstage"><div class="wpointer"></div><div class="wheel"></div><div class="whub">🐎</div></div>`);
  const wheel=wrap.querySelector('.wheel');
  wheel.style.background=`conic-gradient(${stops})`;
  labels.forEach((t,i)=>{
    const lab=el(`<div class="lab">${esc(t)}</div>`);
    lab.style.transform=`translate(-50%,-50%) rotate(${i*seg+seg/2}deg) translateY(-116px)`;
    wheel.appendChild(lab);
  });
  stage.appendChild(wrap);
  return wheel;
}
// random segment + final angle (fresh wheel starts at 0°, so ≥6 full turns then land on segment i)
function pickTarget(N){
  const seg=360/N, i=Math.floor(Math.random()*N), center=i*seg+seg/2;
  return { i, T: ((360-center)%360) + (Math.random()-0.5)*seg*0.5 + 6*360 };
}
function spinTo(wheel,T){
  return new Promise(res=>{
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ wheel.style.transform=`rotate(${T}deg)`; }));
    let done=false; const f=()=>{ if(done) return; done=true; res(); };
    wheel.addEventListener('transitionend',f,{once:true}); setTimeout(f,5600);
  });
}
function waitSpinTap(ctrl){
  return new Promise(res=>{
    ctrl.innerHTML='';
    const b=el(`<button class="btn" style="font-size:18px;padding:14px 30px">🎡 SPIN</button>`);
    b.onclick=()=>{ b.disabled=true; res(); };
    ctrl.appendChild(b);
  });
}
function revealHtml(p){
  return `<div class="bigreveal">${esc(p.label)}<br><b>R${esc(p.raceNo)} ${esc(p.raceName)}</b><br>→ <b style="font-size:30px;color:var(--gold)">#${esc(p.rn)}</b>${p.horse?`<br><span style="font-size:18px">${esc(p.horse)}</span>`:''}</div>`;
}

// Admin: drive the spin
async function openMysteryWheel(m){
  if(m.race_id && !confirm(`Re-spin ${m.label}? It's already on R${raceById(m.race_id)?.race_no} #${m.runner_number}.`)) return;
  await loadAll();
  // same rule as spinMystery: only races still open for betting that have a field loaded
  const live=r=>(S.data.runners||[]).filter(x=>x.race_id===r.id&&!x.scratched);
  const races=(S.data.races||[]).filter(r=>r.track===m.track && !isLocked(r) && live(r).length).sort((a,b)=>a.sort_order-b.sort_order);
  if(!races.length){ alert(`No open ${m.track} race with a field loaded. Load runners first.`); return; }
  const by=(myPlayer()||{}).display_name||'Admin';
  const W=wheelOverlay(m.label,'📡 Live on every phone');
  let saved=false;
  W.close.onclick=()=>{ W.ov.remove(); if(!saved) wheelSend({t:'close',label:m.label}); };
  // spin 1 — the race
  const raceLabels=races.map(r=>'R'+r.race_no);
  const t1='Spin 1 — the RACE';
  W.wt.textContent=t1;
  let wheel=buildWheel(W.stage,raceLabels);
  wheelSend({t:'open',label:m.label,by,stage:1,title:t1,labels:raceLabels});
  await waitSpinTap(W.ctrl);
  let pick=pickTarget(raceLabels.length);
  wheelSend({t:'spin',stage:1,T:pick.T});
  W.ctrl.innerHTML='<div class="count">Spinning…</div>';
  await spinTo(wheel,pick.T);
  if(!document.body.contains(W.ov)) return;
  const race=races[pick.i];
  // spin 2 — the horse
  const field=live(race).sort((a,b)=>a.number-b.number);
  const horseLabels=field.map(r=>'#'+r.number);
  const t2=`Spin 2 — the HORSE · R${race.race_no} ${race.track.slice(0,4)}`;
  const landed=`R${race.race_no} ${race.name}`;
  W.wt.textContent=t2; W.sub.textContent='Race: '+landed;
  wheel=buildWheel(W.stage,horseLabels);
  wheelSend({t:'open',label:m.label,by,stage:2,title:t2,labels:horseLabels,landed});
  await waitSpinTap(W.ctrl);
  pick=pickTarget(horseLabels.length);
  wheelSend({t:'spin',stage:2,T:pick.T});
  W.ctrl.innerHTML='<div class="count">Spinning…</div>';
  await spinTo(wheel,pick.T);
  if(!document.body.contains(W.ov)) return;
  const runner=field[pick.i];
  const {error}=await sb.from('group_bets').update({race_id:race.id,runner_number:runner.number,odds:null}).eq('id',m.id);
  if(error){ alert(error.message); wheelSend({t:'close',label:m.label}); W.ov.remove(); return; }
  saved=true;
  const rv={label:m.label,raceNo:race.race_no,raceName:race.name,rn:runner.number,horse:runner.horse_name};
  wheelSend({t:'reveal',...rv});
  W.wt.textContent='🥂 Locked in!';
  W.stage.innerHTML=revealHtml(rv);
  W.ctrl.innerHTML='';
  const d=el(`<button class="btn">Done 🥩</button>`); d.onclick=async()=>{W.ov.remove();await loadAll();render();}; W.ctrl.appendChild(d);
}

// Everyone else: watch the admin's spin
const WV={W:null,wheel:null,anim:Promise.resolve(),dismissed:null};
function onWheelMsg(p){
  if(!p || !S.me) return;
  const open=()=>WV.W && document.body.contains(WV.W.ov);
  if(p.t==='open'){
    if(p.stage===1) WV.dismissed=null;
    if(WV.dismissed===p.label) return;          // they closed it — don't keep popping it back up
    if(!open()){
      WV.W=wheelOverlay(p.label,`📡 ${p.by} is spinning live`);
      WV.W.close.onclick=()=>{ WV.dismissed=WV.W.ov.dataset.label; WV.W.ov.remove(); };
    }
    WV.W.ov.dataset.label=p.label;
    WV.W.wt.textContent=p.title;
    if(p.landed) WV.W.sub.textContent='Race: '+p.landed;
    WV.wheel=buildWheel(WV.W.stage,p.labels);
    WV.W.ctrl.innerHTML=`<div class="mut small">Waiting for ${esc(p.by)} to spin…</div>`;
  } else if(p.t==='spin'){
    if(!open()||!WV.wheel) return;
    WV.W.ctrl.innerHTML='<div class="count">Spinning…</div>';
    WV.anim=spinTo(WV.wheel,p.T);
  } else if(p.t==='reveal'){
    if(!open()) return;
    const W=WV.W;
    WV.anim.then(()=>{
      if(!document.body.contains(W.ov)) return;
      W.wt.textContent='🥂 Locked in!';
      W.stage.innerHTML=revealHtml(p);
      W.ctrl.innerHTML='';
      const d=el(`<button class="btn">Done 🥩</button>`); d.onclick=()=>W.ov.remove(); W.ctrl.appendChild(d);
    });
  } else if(p.t==='close'){
    if(open()){ WV.W.wt.textContent='Spin cancelled'; WV.W.ctrl.innerHTML=''; setTimeout(()=>{ if(open()) WV.W.ov.remove(); },1500); }
  }
}
async function settleRace(r,winStr,plcStr){
  const win=Number(winStr); if(!win){alert('Enter winner #');return;}
  await loadAll(); // settle every bet in the DB, including ones this phone never received live
  const places=(plcStr||'').split(',').map(s=>Number(s.trim())).filter(Boolean);
  const {error:re}=await sb.from('races').update({status:'resulted',result_win:win,result_places:places,resulted_at:new Date().toISOString()}).eq('id',r.id);
  if(re){ alert('Could not save result: '+re.message); return; }
  const scratched=new Set((S.data.runners||[]).filter(x=>x.race_id===r.id&&x.scratched).map(x=>x.number));
  const problems=[];
  // settle individual + pod bets on this race
  const bets=(S.data.bets||[]).filter(b=>b.race_id===r.id);
  for(const b of bets){
    const mult = b.bet_type==='pick_of_day'?2:1;
    let status='lost', payout=0, pts=0;
    if(scratched.has(b.runner_number)){ status='scratched'; payout=Number(b.stake); pts=0; } // refunded
    else if(b.runner_number===win){ status='won'; payout=Number(b.stake)*Number(b.odds||0); pts=(payout-b.stake)*mult;
      if(!b.odds) problems.push(`${(S.data.players||[]).find(p=>p.id===b.player_id)?.display_name}: winner has no odds`); }
    else { pts = (0-Number(b.stake))*mult; }
    const {error}=await sb.from('bets').update({status,payout,points:pts}).eq('id',b.id);
    if(error) problems.push('bet '+b.id+': '+error.message);
  }
  // settle group bets on this race (feature ×3, getout/mystery ×1) — win-based, place credited for e/w
  const gbs=(S.data.group_bets||[]).filter(g=>g.race_id===r.id);
  for(const g of gbs){
    const mult = g.category==='feature'?3:1;
    const fp = (S.data.feature_picks||[]).find(p=>p.gender===g.gender_scope);
    const rn = g.category==='feature' ? (fp&&fp.locked?fp.runner_number:null) : g.runner_number;
    // don't settle a team bet we can't price — fix it in "Group bets" and tap Re-settle
    if(!rn){ problems.push(`${g.label}: no horse${g.category==='feature'?' (lock the feature vote first)':''}`); continue; }
    if(scratched.has(rn)){ await sb.from('group_bets').update({status:'scratched',points:0}).eq('id',g.id); continue; }
    if(!(Number(g.odds)>1)){ problems.push(`${g.label}: no odds entered`); continue; }
    let status='lost', pts=0;
    const won = rn===win, placed = won || places.includes(rn);
    if(g.bet_mode==='ew'){
      // $50 win + $50 place; approximate payout using entered odds (win odds); place pays ~1/4 odds
      const half=Number(g.stake)/2; const od=Number(g.odds||0);
      let pay=0; if(won) pay+=half*od; if(placed) pay+=half*(1+(od-1)/4);
      status = won?'won':(placed?'placed':'lost'); pts=(pay-Number(g.stake))*mult;
    } else {
      if(won){ status='won'; pts=(Number(g.stake)*Number(g.odds||0)-g.stake)*mult; }
      else { pts=(0-Number(g.stake))*mult; }
    }
    const {error}=await sb.from('group_bets').update({status,points:pts}).eq('id',g.id);
    if(error) problems.push(g.label+': '+error.message);
  }
  msg(`R${r.race_no} settled on #${win} ✓`);
  if(problems.length) alert(`R${r.race_no} settled, but not everything:\n\n• ${problems.join('\n• ')}\n\nFix these, then tap Re-settle.`);
  await loadAll(); render();
}
function msg(t){ const m=document.querySelector('#aMsg'); if(m) m.textContent=t; }

// ---------- boot ----------
document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>{S.view=a.dataset.view;render();window.scrollTo(0,0);});
async function boot(){
  await loadAll();
  const saved=localStorage.getItem('qs_me');
  if(saved && (S.data.players||[]).some(p=>p.id===Number(saved))) S.me=Number(saved);
  render();
  // realtime: any change reloads
  // debounced: a settle fires dozens of row changes at once
  let t=null;
  sb.channel('qs').on('postgres_changes',{event:'*',schema:'public'},()=>{
    clearTimeout(t); t=setTimeout(async()=>{ await loadAll(); liveRender(); },400);
  }).subscribe();
  // live Mystery wheel (broadcast only — the admin's own phone doesn't receive its own messages)
  if(window.__wheelBus) window.__wheelBus.listen(onWheelMsg);
  else wheelCh=sb.channel('qs-wheel',{config:{broadcast:{self:false}}}).on('broadcast',{event:WHEEL_EVENT},({payload})=>onWheelMsg(payload)).subscribe();
}
boot().catch(e=>{ $('#app').innerHTML=`<div class="wrap"><div class="card warn">Load error: ${esc(e.message)}<br><br>If this is the first run, the database tables may not be applied yet.</div></div>`; });
</script>
